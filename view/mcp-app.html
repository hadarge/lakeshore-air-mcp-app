<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Lakeshore Air · My trip</title>
</head>
<body>
  <main class="app" id="app" aria-busy="true">
    <header class="hdr">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 13.2 20.6 5.4c.9-.4 1.7.6 1.1 1.4l-7.4 10.4c-.5.7-1.6.6-1.9-.2l-1.5-3.6-3.9-1.3Z" fill="currentColor"/><path d="m10.9 13.4 3.3-3.3" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".55"/></svg>
        </span>
        <div class="brand-text">
          <strong>Lakeshore Air</strong>
          <span class="sub" id="sub">My trip</span>
        </div>
      </div>
      <span class="pill" id="pill" data-tone="wait">…</span>
    </header>

    <section class="pass" id="pass" aria-label="Your flight">
      <div class="pass-top">
        <span class="fl" id="p-flight">…</span>
        <span class="dot" aria-hidden="true"></span>
        <span id="p-date"></span>
        <span class="dot" aria-hidden="true"></span>
        <span>Seat <b id="p-seat"></b></span>
        <span class="changed-from" id="p-changed" hidden></span>
      </div>
      <div class="route">
        <div class="end">
          <span class="code" id="p-from"></span>
          <span class="city" id="p-from-city"></span>
          <span class="time"><s id="p-dep-was"></s><span id="p-dep"></span></span>
        </div>
        <div class="path" aria-hidden="true">
          <span class="line"></span>
          <span class="plane"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" fill="currentColor" transform="rotate(90 12 12)"/></svg></span>
          <span class="dur" id="p-dur"></span>
        </div>
        <div class="end right">
          <span class="code" id="p-to"></span>
          <span class="city" id="p-to-city"></span>
          <span class="time"><s id="p-arr-was"></s><span id="p-arr"></span></span>
        </div>
      </div>
      <p class="notice" id="notice" hidden></p>
    </section>

    <section class="options" id="options" hidden aria-labelledby="opt-h">
      <div class="opt-head">
        <h3 id="opt-h">Change to another flight today</h3>
        <span class="free">No change fee</span>
      </div>
      <div class="opt-list" id="opt-list" role="radiogroup" aria-labelledby="opt-h"></div>
    </section>

    <footer class="foot">
      <span class="meta" id="meta"></span>
      <span class="status" id="status" role="status"></span>
      <button class="btn" id="confirm" disabled>Select a flight</button>
    </footer>
  </main>
  <script type="module" src="./app.ts"></script>
</body>
</html>
