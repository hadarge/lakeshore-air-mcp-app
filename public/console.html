<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presenter console · Lakeshore Air demo</title>
<style>
  :root { --ink: #f4f2fa; --muted: #a1a1aa; --bg: #0a0a0a; --card: #141416; --line: #26262b; --purple: #8039fd; --lilac: #c9a0ff; --orange: #ff8651; --green: #3ddc97; --sans: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: ui-monospace, "SF Mono", Menlo, monospace; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--sans); }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 16px 60px; display: flex; flex-direction: column; gap: 18px; }
  h1 { margin: 0; font-weight: 500; font-size: 22px; }
  h1 small { color: var(--muted); font-size: 14px; font-weight: 400; margin-left: 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  label.sw { display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 10px 0; }
  label.sw input { display: none; }
  .track { width: 46px; height: 26px; border-radius: 13px; background: #3a3a42; position: relative; transition: background .2s; flex: none; }
  .track::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .2s; }
  input:checked + .track { background: var(--orange); }
  input:checked + .track::after { left: 23px; }
  .sw b { display: block; font-weight: 600; }
  .sw small { color: var(--muted); }
  button { font: inherit; border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer; background: #26262b; color: var(--ink); }
  button.primary { background: var(--purple); }
  input[type=password], input[type=text] { font: inherit; background: #0a0a0a; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; width: 140px; }
  .kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 14px; font-size: 14px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; font-family: var(--mono); }
  pre { margin: 0; font: 12px/1.5 var(--mono); color: #d4d4da; white-space: pre-wrap; max-height: 320px; overflow: auto; }
  a { color: var(--lilac); }
  .msg { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Presenter console <small>Lakeshore Air demo</small></h1>
  <div class="card row">
    <span>PIN</span><input type="password" id="pin" autocomplete="off">
    <span>Customer</span><input type="text" id="cust" value="stage">
    <button id="load">Load</button>
    <span class="msg" id="msg"></span>
  </div>
  <div class="card">
    <label class="sw"><input type="checkbox" id="line"><span class="track"></span><span><b>Freshness line</b><small>One line in every result the model reads: trip version, as-of, "call get_trip before acting on it".</small></span></label>
    <label class="sw"><input type="checkbox" id="handoff"><span class="track"></span><span><b>View hand-off (measurement)</b><small>After a change, the view calls ui/update-model-context with the new trip.</small></span></label>
    <label class="sw"><input type="checkbox" id="guard"><span class="track"></span><span><b>Version check on writes</b><small>notify_contact is refused unless its tripVersion is the current one.</small></span></label>
  </div>
  <div class="card row">
    <button class="primary" id="reset">Reset trip (LK 412 delayed, both off)</button>
    <a id="l-trip" target="_blank">Airline page</a> · <a id="l-phone" target="_blank">Keren's phone</a>
  </div>
  <div class="card"><dl class="kv" id="kv"></dl></div>
  <div class="card"><pre id="audit"></pre></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
try { $("pin").value = sessionStorage.getItem("pin") || ""; } catch {}
const body = (x = {}) => JSON.stringify({ pin: $("pin").value, c: $("cust").value || "stage", ...x });
async function call(p, x) {
  const r = await fetch("api/" + p, { method: "POST", headers: { "content-type": "application/json" }, body: body(x) });
  if (r.status === 403) { $("msg").textContent = "Wrong PIN"; throw new Error("pin"); }
  $("msg").textContent = ""; return r.json();
}
async function load() {
  try { sessionStorage.setItem("pin", $("pin").value); } catch {}
  const c = encodeURIComponent($("cust").value || "stage");
  $("l-trip").href = `trip?c=${c}&pin=${encodeURIComponent($("pin").value)}`; $("l-phone").href = `phone?c=${c}`;
  const t = await call("state");
  $("line").checked = t.mode.line; $("guard").checked = t.mode.guard; $("handoff").checked = !!t.mode.handoff;
  const kv = $("kv"); kv.replaceChildren();
  const add = (k, v) => { const dt = document.createElement("dt"); dt.textContent = k; const dd = document.createElement("dd"); dd.textContent = v; kv.append(dt, dd); };
  add("Flight", t.flightId); add("Version", t.token); add("Texts sent", String(t.messages.length));
  if (t.messages.length) add("Last text", t.messages[t.messages.length - 1].text);
  $("audit").textContent = t.audit.slice(-20).join("\n") || "(no audit lines yet)";
}
$("load").onclick = () => load().catch(() => {});
$("line").onchange = (e) => call("mode", { line: e.target.checked }).then(load).catch(() => {});
$("guard").onchange = (e) => call("mode", { guard: e.target.checked }).then(load).catch(() => {});
$("handoff").onchange = (e) => call("mode", { handoff: e.target.checked }).then(load).catch(() => {});
$("reset").onclick = () => call("reset").then(load).catch(() => {});
if ($("pin").value) { load().catch(() => {}); }
setInterval(() => { if ($("pin").value && !document.hidden) load().catch(() => {}); }, 3000);
</script>
</body>
</html>
